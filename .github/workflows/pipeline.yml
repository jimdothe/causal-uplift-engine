name: Data pipeline

# extract → load (Snowflake RAW) → dbt build (STAGING, VALIDATED, ANALYTICS + tests)
# Export to Parquet and model prep run on the college GPU server (see docs/PROJECT_PLAN.md section 7).

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to run"
        type: choice
        options: [hillstrom, criteo, both]
        default: hillstrom
  # Enable once the Snowflake secrets are set (Linear: CUE M1 "GitHub Actions pipeline.yml"):
  # push:
  #   branches: [main]
  #   paths: ["pipeline/**", "warehouse/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

env:
  DATA_DIR: ${{ github.workspace }}/data
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[pipeline]"

      - name: Pick datasets
        id: ds
        run: |
          choice="${{ github.event.inputs.dataset || 'hillstrom' }}"
          if [ "$choice" = "both" ]; then echo "list=hillstrom criteo" >> "$GITHUB_OUTPUT"; else echo "list=$choice" >> "$GITHUB_OUTPUT"; fi

      - name: Extract
        run: for d in ${{ steps.ds.outputs.list }}; do python -m pipeline.extract --dataset "$d"; done

      - name: Load into Snowflake RAW
        run: for d in ${{ steps.ds.outputs.list }}; do python -m pipeline.load_snowflake --dataset "$d"; done

      - name: dbt build (models + tests)
        working-directory: warehouse
        run: |
          mkdir -p ~/.dbt && cp profiles.example.yml ~/.dbt/profiles.yml
          sel=""
          for d in ${{ steps.ds.outputs.list }}; do sel="$sel +$d+"; done
          dbt build --target ci --select $sel

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: raw-manifests
          path: data/raw/*/manifest.json
